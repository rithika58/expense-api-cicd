# nginx site for the EC2 host.
# Traffic comes in on :80, nginx proxies to whichever container port the
# deploy script last marked healthy (8000 or 8001).
#
# The `upstream expense_api` block lives in
# /etc/nginx/conf.d/upstream-expense-api.conf so remote-deploy.sh can rewrite
# it atomically and reload nginx without touching this file.

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/expense-api.access.log;
    error_log  /var/log/nginx/expense-api.error.log warn;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://expense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://expense_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # The old container may still be catching a request as we swap.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;
}
