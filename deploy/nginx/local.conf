# Local reverse proxy (docker-compose).
# "app" resolves via Docker's embedded DNS on the user-defined bridge network
# "expense-net" - this is exactly the container networking the JD mentions.
upstream expense_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Probe endpoint is passed straight through (no caching, no buffering).
    location = /health {
        proxy_pass http://expense_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://expense_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Retry the next upstream instead of surfacing a 502 mid-deploy.
        proxy_next_upstream error timeout http_502 http_503;
    }

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;
}
