name: expense-api

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: expense-api:local
    environment:
      DATABASE_URL: sqlite:////data/expenses.db
      APP_ENV: docker-compose
      LOG_LEVEL: INFO
      GIT_SHA: ${GIT_SHA:-local}
    volumes:
      # Named volume for persistent data, bind mount for logs you can tail.
      - expense-data:/data
      - ./logs:/app/logs
    expose:
      - "8000"          # internal only - nginx is the single ingress
    networks:
      - expense-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; \
sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"       # -> http://localhost:8080
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - expense-net
    restart: unless-stopped

volumes:
  expense-data:

networks:
  expense-net:
    driver: bridge
